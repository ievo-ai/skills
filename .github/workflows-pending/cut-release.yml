name: Cut Release

# On merge to main, if the plugin version changed, cut the matching
# vX.Y.Z git tag + GitHub Release with the corresponding CHANGELOG.md
# section as the release body. Pairs with notify-release.yml (which
# announces the same version-change event to the iEvo Telegram via a
# cross-repo dispatch but never cuts a release of its own).
#
# Also supports workflow_dispatch with a `version` input — short-circuits
# the version-change detection so an operator can manually cut a missed
# release (e.g. the v0.33.0 bootstrap when this workflow first lands, or
# any future "we missed one" recovery).
#
# Idempotent: if the tag/release for the resolved version already exists
# the job exits 0 without touching anything (tag immutability — we never
# force-update). The default failure of `gh release create` on a duplicate
# tag is the secondary guard if the pre-check race-loses.
#
# See #259.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to cut (e.g. 0.33.0 or v0.33.0) — short-circuits version-change detection. Use for missed releases."
        required: true
        type: string

permissions:
  contents: write

jobs:
  cut:
    # workflow_dispatch always runs; pull_request only on a merged PR (mirrors notify-release.yml).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (HEAD + previous main, to detect a version change)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 2

      - name: Resolve version to cut
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual bootstrap path — operator-supplied version. Strip an
            # optional leading "v" so both "0.33.0" and "v0.33.0" work.
            new="${INPUT_VERSION#v}"
            if [ -z "$new" ]; then
              echo "::error::workflow_dispatch input 'version' is empty"
              exit 1
            fi
            # Format guard — defense in depth against shell-injection via the
            # input (already env-passed, but cheap to validate semver shape).
            if ! printf '%s' "$new" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Invalid version '$new' — must be NNN.NNN.NNN (semver, no leading v required)"
              exit 1
            fi
            echo "Manual cut requested for v${new}"
            echo "new=$new" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            # Mirror notify-release.yml's delta-detection one-liner exactly —
            # both workflows MUST agree on what "the plugin version changed"
            # means. If you edit one, edit both (the two workflows are a pair).
            new=$(python3 -c "import json;print(json.load(open('plugins/ievo/.claude-plugin/plugin.json')).get('version',''))" 2>/dev/null || true)
            old=$(git show HEAD^1:plugins/ievo/.claude-plugin/plugin.json 2>/dev/null \
                  | python3 -c "import sys,json;print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            echo "new=$new" >> "$GITHUB_OUTPUT"
            if [ -n "$new" ] && [ "$new" != "$old" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Plugin version ${old:-<none>} -> ${new} — cutting release"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No plugin version change (${old:-<none>} -> ${new:-<none>}) — skipping cut"
            fi
          fi

      - name: Generate App token
        if: steps.ver.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Idempotency check (skip if release already exists)
        if: steps.ver.outputs.changed == 'true'
        id: idem
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists — nothing to do (tag is immutable)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section
        if: steps.ver.outputs.changed == 'true' && steps.idem.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          # Capture from `## vX.Y.Z` (anchored exact match) through the line
          # before the next `## v` heading. Then drop standalone `---` lines
          # (CHANGELOG separators between version entries) and trim leading +
          # trailing blank lines so the Release body reads cleanly.
          body=$(awk -v ver="## v${VERSION}" '
            $0 == ver { capture = 1; next }
            capture && /^## v[0-9]/ { exit }
            capture { print }
          ' CHANGELOG.md | sed '/^---$/d' | awk '
            NF { found = 1 }
            found { lines[++n] = $0 }
            END {
              while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
              for (i = 1; i <= n; i++) print lines[i]
            }')
          if [ -z "$body" ]; then
            echo "::error::CHANGELOG.md has no '## v${VERSION}' section (or it is empty). Per repo convention every version bump must include a CHANGELOG entry — add one and re-run."
            exit 1
          fi
          printf '%s\n' "$body" > /tmp/release-body.md
          echo "CHANGELOG section for v${VERSION}:"
          echo "---"
          cat /tmp/release-body.md
          echo "---"

      - name: Cut tag + GitHub Release
        if: steps.ver.outputs.changed == 'true' && steps.idem.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          # `gh release create` creates the tag (at the workflow's checked-out
          # SHA) and the GitHub Release in a single API call — atomic, no
          # separate `git tag` / `git push` step. Never `--force`; the default
          # failure on a duplicate tag is the second guard behind the
          # idempotency check above.
          gh release create "v${VERSION}" \
            --repo "$REPO" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-body.md
          echo "Cut v${VERSION} release at ${GITHUB_SHA}"
