name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allow review on PRs created by the claude[bot] App actor.
          # The issue-handler workflow (issue-handler.yml, v0.6.16) opens
          # PRs as claude[bot] via the org App token; without this allowlist,
          # claude-code-action refuses with "Workflow initiated by non-human
          # actor: claude (type: Bot)" and the handler's Phase 5 review loop
          # never gets a verdict to iterate on. We restrict to the named bot
          # (not '*') to keep the gate against arbitrary other bot actors.
          # First observed at workflow run 26360560927 on PR #75 (v0.6.18
          # handler-generated PR).
          allowed_bots: 'claude[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Surface the verdict on the PR, not just in the Actions log.
          # track_progress creates a sticky tracking comment with checkboxes that updates
          # as Claude reviews — gives the PR author a verdict even when no inline findings
          # exist (previous default behaviour was a green check with no PR-side artifact).
          # See: github.com/anthropics/claude-code-action/blob/main/examples/pr-review-comprehensive.yml
          track_progress: true
          use_sticky_comment: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
