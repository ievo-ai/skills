# Conflict Resolver — auto-rebase stale handler PRs
#
# When main advances and open handler PRs become DIRTY, GitHub Actions
# stops running `pull_request` workflows on them, leaving findings
# stuck with no path to merge. This workflow detects DIRTY handler PRs
# and auto-rebases them, resolving `.github/prompts/*.md` conflicts by
# taking main's version (they are shared infrastructure edited by
# multiple handler runs).
#
# Triggers:
#   - push to main (run immediately after merge)
#   - schedule every 6h (safety net for missed triggers)
#   - workflow_dispatch (manual)
#
# Safety:
#   - Only handler-authored PRs (app/claude or claude[bot])
#   - Escalates non-infrastructure conflicts to PR + issue comments
#   - Never auto-merges — human must review and merge
#
# See: ievo-ai/skills#145

name: "Conflict Resolver"

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: conflict-resolver
  cancel-in-progress: false

jobs:
  resolve:
    name: "Auto-rebase stale handler PRs"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "iEVO"
          git config user.email "noreply@ievo.ai"

      - name: Find and rebase DIRTY handler PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PRS=$(gh pr list --repo "$REPO" --state open \
            --json number,headRefName,author,mergeStateStatus \
            --jq '.[] | select(.mergeStateStatus == "DIRTY") | select(.author.login == "app/claude" or .author.login == "claude[bot]") | "\(.number) \(.headRefName)"')

          if [ -z "$PRS" ]; then
            echo "No DIRTY handler PRs found"
            exit 0
          fi

          echo "$PRS" | while IFS=' ' read -r PR_NUMBER BRANCH; do
            echo "::group::Rebasing PR #$PR_NUMBER ($BRANCH)"

            git fetch origin main
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            MERGE_BASE=$(git merge-base HEAD origin/main)
            if git rebase --onto origin/main "$MERGE_BASE" HEAD; then
              echo "Clean rebase for PR #$PR_NUMBER"
            else
              REBASE_OK=true
              ROUND=0
              MAX_ROUNDS=20
              while [ "$ROUND" -lt "$MAX_ROUNDS" ]; do
                ROUND=$((ROUND + 1))
                CONFLICTING=$(git diff --name-only --diff-filter=U 2>/dev/null)
                if [ -z "$CONFLICTING" ]; then
                  break
                fi
                ALL_INFRA=true
                while IFS= read -r file; do
                  case "$file" in
                    .github/prompts/*.md)
                      git checkout --ours "$file"
                      git add "$file"
                      ;;
                    *)
                      ALL_INFRA=false
                      break
                      ;;
                  esac
                done <<< "$CONFLICTING"
                if [ "$ALL_INFRA" = "false" ]; then
                  REBASE_OK=false
                  break
                fi
                if GIT_EDITOR=true git rebase --continue; then
                  break
                fi
                if [ -z "$(git diff --name-only --diff-filter=U 2>/dev/null)" ]; then
                  if git diff --cached --quiet && git diff --quiet; then
                    git rebase --skip || { REBASE_OK=false; break; }
                    continue
                  fi
                  REBASE_OK=false
                  break
                fi
              done

              if [ "$ROUND" -ge "$MAX_ROUNDS" ] || [ -d "$(git rev-parse --git-dir)/rebase-merge" ] || [ -d "$(git rev-parse --git-dir)/rebase-apply" ]; then
                REBASE_OK=false
                git rebase --abort 2>/dev/null || true
              fi

              if [ "$REBASE_OK" = "false" ]; then
                gh pr comment "$PR_NUMBER" --repo "$REPO" \
                  --body "Auto-rebase failed — conflict in files outside .github/prompts/. Operator review needed."
                echo "::endgroup::"
                continue
              fi
              echo "Auto-resolved .github/prompts/ conflicts for PR #$PR_NUMBER"
            fi

            git fetch origin main
            FINAL_BEHIND=$(git rev-list --count HEAD..origin/main)
            if [ "$FINAL_BEHIND" != "0" ]; then
              gh pr comment "$PR_NUMBER" --repo "$REPO" \
                --body "Auto-rebase: main moved during rebase ($FINAL_BEHIND commits) — will retry on next trigger."
              echo "::endgroup::"
              continue
            fi

            git push --force-with-lease origin HEAD
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "Auto-rebased onto latest main."
            echo "Rebased and pushed PR #$PR_NUMBER"
            echo "::endgroup::"
          done
