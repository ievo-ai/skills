name: Cut Release

# On merge to main, if the plugin version changed, cut the matching
# vX.Y.Z git tag + GitHub Release with the corresponding CHANGELOG.md
# section as the release body. Pairs with notify-release.yml (which
# announces the same version-change event to the iEvo Telegram via a
# cross-repo dispatch but never cuts a release of its own).
#
# Also supports workflow_dispatch with a `version` input — short-circuits
# the version-change detection so an operator can manually cut a missed
# release (e.g. the v0.33.0 bootstrap when this workflow first lands, or
# any future "we missed one" recovery).
#
# Idempotent: if the tag/release for the resolved version already exists
# the job exits 0 without touching anything (tag immutability — we never
# force-update). The default failure of `gh release create` on a duplicate
# tag is the secondary guard if the pre-check race-loses.
#
# See #259.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to cut (e.g. 0.33.0 or v0.33.0) — short-circuits version-change detection. Use for missed releases."
        required: true
        type: string

permissions:
  contents: read

# Serialize on the workflow name — two simultaneous version-bump merges would
# otherwise both pass the `gh release view` idempotency pre-check and race to
# `gh release create`, where the second loses with a duplicate-tag error.
# Queueing (`cancel-in-progress: false`) keeps the second run alive; once the
# first finishes the pre-check sees the release and cleanly no-ops. Version
# bumps are infrequent so this is defensive, not load-bearing.
concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    # workflow_dispatch always runs; pull_request only on a merged PR (mirrors notify-release.yml).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (HEAD + previous main, to detect a version change)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 2

      - name: Resolve version to cut
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual bootstrap path — operator-supplied version. Strip an
            # optional leading "v" so both "0.33.0" and "v0.33.0" work.
            new="${INPUT_VERSION#v}"
            if [ -z "$new" ]; then
              echo "::error::workflow_dispatch input 'version' is empty"
              exit 1
            fi
            # Format guard — defense in depth against shell-injection via the
            # input (already env-passed, but cheap to validate semver shape).
            # Bash's `[[ =~ ]]` anchors ^/$ to the WHOLE string, unlike
            # `grep -E '^...$'`, which anchors per line and would accept a
            # multi-line value whose first line happens to look like semver.
            if ! [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid version '$new' — must be NNN.NNN.NNN (semver, no leading v required)"
              exit 1
            fi
            echo "Manual cut requested for v${new}"
            echo "new=$new" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            # Mirror notify-release.yml's delta-detection one-liner exactly —
            # both workflows MUST agree on what "the plugin version changed"
            # means. If you edit one, edit both (the two workflows are a pair).
            new=$(python3 -c "import json;print(json.load(open('plugins/ievo/.claude-plugin/plugin.json')).get('version',''))" 2>/dev/null || true)
            old=$(git show HEAD^1:plugins/ievo/.claude-plugin/plugin.json 2>/dev/null \
                  | python3 -c "import sys,json;print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            # `old` comes from a HISTORICAL commit's plugin.json — a prior PR
            # merge this workflow guard didn't exist to reject — so it's just
            # as attacker-influenceable as `new` and only ever reaches a log
            # line (never $GITHUB_OUTPUT), but an embedded newline in it could
            # still smuggle a spoofed `::error::`/`::add-mask::` workflow-log
            # command. Never write raw `old` to a log line — substitute a
            # placeholder when it isn't bare semver.
            old_display="$old"
            if [ -n "$old" ] && ! [[ "$old" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              old_display="<invalid>"
            fi
            # Format guard — plugin.json's version is attacker-influenced (any
            # PR author can edit it) and flows into the public release tag /
            # title below; reject anything that isn't bare semver before it
            # ever reaches $GITHUB_OUTPUT (mirrors the workflow_dispatch guard
            # above — CWE-20, skills#379). Bash's `[[ =~ ]]` anchors ^/$ to the
            # WHOLE string, unlike `grep -E '^...$'`, which anchors per line
            # and would accept a multi-line value whose first line happens to
            # look like semver.
            if [ -n "$new" ] && ! [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::plugin.json version '$new' is not valid semver (NNN.NNN.NNN) — refusing to use it"
              exit 1
            fi
            # Delimiter-based multiline write (unique per run) — even a
            # validated value gets the safe form, so an embedded newline can
            # never inject extra $GITHUB_OUTPUT keys regardless of guard
            # ordering.
            delim="ghoutput_new_${RANDOM}${RANDOM}"
            {
              echo "new<<${delim}"
              echo "$new"
              echo "${delim}"
            } >> "$GITHUB_OUTPUT"
            if [ -n "$new" ] && [ "$new" != "$old" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Plugin version ${old_display:-<none>} -> ${new} — cutting release"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No plugin version change (${old_display:-<none>} -> ${new:-<none>}) — skipping cut"
            fi
          fi

      - name: Generate App token
        if: steps.ver.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Idempotency check (skip if release already exists)
        if: steps.ver.outputs.changed == 'true'
        id: idem
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists — nothing to do (tag is immutable)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section
        if: steps.ver.outputs.changed == 'true' && steps.idem.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          # Capture from `## vX.Y.Z` (heading + optional trailing subtitle)
          # through the line before the next `## v` heading. Then drop
          # standalone `---` lines (CHANGELOG separators between version
          # entries) and trim leading + trailing blank lines so the Release
          # body reads cleanly. `index()` + `substr()` avoid regex-escaping
          # the dots in the version (a regex `^## v0.33.0` would match
          # `## v0e33e0` too); we want literal-prefix + word-boundary.
          body=$(awk -v ver="## v${VERSION}" '
            index($0, ver) == 1 && (length($0) == length(ver) || substr($0, length(ver) + 1, 1) == " ") { capture = 1; next }
            capture && /^## v[0-9]/ { exit }
            capture { print }
          ' CHANGELOG.md | sed '/^---$/d' | awk '
            NF { found = 1 }
            found { lines[++n] = $0 }
            END {
              while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
              for (i = 1; i <= n; i++) print lines[i]
            }')
          if [ -z "$body" ]; then
            echo "::error::CHANGELOG.md has no '## v${VERSION}' section (or it is empty). Per repo convention every version bump must include a CHANGELOG entry — add one and re-run."
            exit 1
          fi
          printf '%s\n' "$body" > /tmp/release-body.md
          # Format guard (warn, not fail) — a well-formed entry per AGENTS.md
          # § "Changelog goes in CHANGELOG.md" is a summary line + a markdown
          # bullet list, and this section becomes the public Release body
          # verbatim. A section with zero list items is the old wall-of-text
          # shape (#306) that renders as an unreadable Releases page. Warn so
          # the regression is visible in the run log without blocking an
          # otherwise-valid release (the `if !` guard keeps `set -e` happy on
          # grep's no-match exit 1).
          if ! grep -qE '^[[:space:]]*[-*] ' /tmp/release-body.md; then
            echo "::warning::CHANGELOG section for v${VERSION} has no markdown list items — the Release body may render as a wall of text. See AGENTS.md changelog entry structure (#306)."
          fi
          echo "CHANGELOG section for v${VERSION}:"
          echo "---"
          cat /tmp/release-body.md
          echo "---"

      - name: Cut tag + GitHub Release
        if: steps.ver.outputs.changed == 'true' && steps.idem.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          # `gh release create` creates the tag and the GitHub Release in a
          # single API call — atomic, no separate `git tag` / `git push` step.
          # `--target "$GITHUB_SHA"` pins the tag to the workflow's checked-out
          # commit; without it the GitHub Releases API defaults
          # `target_commitish` to the default branch's HEAD at API-call time,
          # which races a concurrent merge (the tag could land on a commit
          # this workflow never saw). Never `--force`; the default failure on
          # a duplicate tag is the second guard behind the idempotency check.
          gh release create "v${VERSION}" \
            --repo "$REPO" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-body.md \
            --target "$GITHUB_SHA"
          echo "Cut v${VERSION} release at ${GITHUB_SHA}"
