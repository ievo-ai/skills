# Fix Command — extend review-fixer budget via /fix PR comment
#
# When an org member (MEMBER or OWNER) comments exactly "/fix" on a
# handler-authored PR, this workflow:
#   1. Counts /fix comments from org members to calculate effective budget
#   2. Posts acknowledgment with the new budget
#   3. Runs the same fixer logic as review-fixer.yml
#
# Budget model: base 5 + (org_member_fix_comments * 5).
# Each /fix is an explicit +5 extension — NOT unlimited.
#
# Shares the review-fixer concurrency group so that /fix and auto-fixer
# never run simultaneously on the same PR.
#
# Safety:
#   - Only org members (MEMBER/OWNER author_association) can trigger
#   - Only handler-authored PRs (claude[bot] / app/claude)
#   - Uses [pr-fix-N] commit markers (shared budget with review-fixer)
#   - Never auto-merges — human must review and merge
#
# See: ievo-ai/skills#135

name: "Fix Command"

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: review-fixer-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix-on-command:
    name: "Handle /fix Command"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == '/fix' &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER')

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check author and calculate budget
        id: budget
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "::group::Gate: author check"
          AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author --jq '.author.login')
          echo "PR #$PR_NUMBER author: $AUTHOR"

          if [ "$AUTHOR" != "app/claude" ] && [ "$AUTHOR" != "claude[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SKIP — not a handler-authored PR (author=$AUTHOR)"
            echo "::endgroup::"
            exit 0
          fi
          echo "PASS — handler-authored PR"
          echo "::endgroup::"

          echo "::group::Gate: budget calculation"
          FIX_EXTENSIONS=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body == "/fix") | select(.author_association | test("MEMBER|OWNER"))] | length' \
            | awk '{s+=$1} END{print s+0}')
          EFFECTIVE_BUDGET=$((5 + FIX_EXTENSIONS * 5))
          echo "Extensions: $FIX_EXTENSIONS → effective budget: $EFFECTIVE_BUDGET"

          BRANCH=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq '.headRefName')
          FIX_COUNT=$(gh api "repos/$REPO/commits?sha=$BRANCH&per_page=100" \
            --jq '[.[] | select(.commit.message | test("\\[pr-fix-"))] | length')
          echo "Fix attempts so far: $FIX_COUNT / $EFFECTIVE_BUDGET"

          if [ "$FIX_COUNT" -ge "$EFFECTIVE_BUDGET" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "Budget exhausted ($FIX_COUNT/$EFFECTIVE_BUDGET) even with /fix extensions. Each \`/fix\` adds +5 attempts."
            echo "SKIP — budget exhausted even with extensions"
            echo "::endgroup::"
            exit 0
          fi

          FIX_NUMBER=$((FIX_COUNT + 1))
          echo "PASS — budget available (attempt $FIX_NUMBER/$EFFECTIVE_BUDGET)"
          echo "::endgroup::"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "fix_number=$FIX_NUMBER" >> "$GITHUB_OUTPUT"
          echo "effective_budget=$EFFECTIVE_BUDGET" >> "$GITHUB_OUTPUT"

      - name: Check for actionable findings
        if: steps.budget.outputs.skip != 'true'
        id: findings
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          REVIEW_BODY=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.user.login | test("claude.*\\[bot\\]"; "i"))
                       | select(.body | test("^(Budget exhausted|No actionable findings|Budget extended to|Review fixer exhausted)") | not)
                  ] | last.body // ""')

          HAS_FINDINGS=false
          if echo "$REVIEW_BODY" | grep -qiE '### Finding|### Bug|\*\*Finding|\*\*Bug|\[Fix this|severity.*(must|should) fix'; then
            HAS_FINDINGS=true
          fi

          CHECKS_JSON=$(gh pr checks "$PR_NUMBER" --repo "$REPO" --json name,state 2>/dev/null || echo "[]")
          COVERAGE_FAIL=$(echo "$CHECKS_JSON" | jq -r '[.[] | select(.name | test("coverage"; "i")) | select(.state | ascii_upcase == "FAIL")] | length')
          PRECOMMIT_FAIL=$(echo "$CHECKS_JSON" | jq -r '[.[] | select(.name | test("pre[-.]commit"; "i")) | select(.state | ascii_upcase == "FAIL")] | length')

          if [ "$HAS_FINDINGS" = "false" ] && [ "$COVERAGE_FAIL" = "0" ] && [ "$PRECOMMIT_FAIL" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "No actionable findings or failing checks found. Nothing to fix."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Findings: $HAS_FINDINGS, coverage failures: $COVERAGE_FAIL, pre-commit failures: $PRECOMMIT_FAIL"

      - name: Post acknowledgment
        if: steps.budget.outputs.skip != 'true' && steps.findings.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "Budget extended to ${{ steps.budget.outputs.effective_budget }}. Retrying fix attempt ${{ steps.budget.outputs.fix_number }}/${{ steps.budget.outputs.effective_budget }}..."

      - name: Checkout PR branch
        if: steps.budget.outputs.skip != 'true' && steps.findings.outputs.skip != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.budget.outputs.branch }}
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.budget.outputs.skip != 'true' && steps.findings.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      - name: Load fixer prompt
        if: steps.budget.outputs.skip != 'true' && steps.findings.outputs.skip != 'true'
        run: |
          if [ ! -f .github/prompts/review-fixer.md ]; then
            echo "::warning::review-fixer.md not found on this branch — skipping"
            echo "FIXER_PROMPT=Review fixer prompt file not available on this branch." >> "$GITHUB_ENV"
            exit 0
          fi
          if grep -qxF 'FIXER_PROMPT_EOF' .github/prompts/review-fixer.md 2>/dev/null; then
            echo "::error::review-fixer.md contains the heredoc delimiter"
            exit 1
          fi
          {
            echo "FIXER_PROMPT<<FIXER_PROMPT_EOF"
            cat .github/prompts/review-fixer.md
            echo ""
            echo "FIXER_PROMPT_EOF"
          } >> "$GITHUB_ENV"

      - name: Fix findings
        if: steps.budget.outputs.skip != 'true' && steps.findings.outputs.skip != 'true'
        uses: anthropics/claude-code-action@537ffff2eff706bd7e3e1c3daf2d4b39067a9f85  # v1.0.133
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          FIX_NUMBER: ${{ steps.budget.outputs.fix_number }}
          EFFECTIVE_BUDGET: ${{ steps.budget.outputs.effective_budget }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Attribute fix commits to the iEvo App bot, not the default claude[bot].
          # The push already authenticates as the App (checkout token); these inputs
          # align the commit author so the visible identity matches the pusher.
          bot_id: "264606751"
          bot_name: "ievo-eva[bot]"
          allowed_bots: "claude"
          claude_args: |
            --model sonnet
            --allowedTools "Bash,Edit,Read,Write,Glob,Grep"
          prompt: ${{ env.FIXER_PROMPT }}
