# Forward member-authored issue events to Eva (the private cross-repo brain).
# D-004 / eva#106 Phase 2 — thin forwarder, zero prompts, zero logic.
#
# skills is public, so it mints a short-lived GitHub App token and dispatches
# with that — no long-lived broad token sitting in a public repo. The dispatch's
# triggering actor becomes the App bot; the eva-side Router and eva-implement
# both allow that bot.
#
# Two relays, both repository_dispatch to ievo-ai/eva:
#   - issues:opened           → new-issue       → Eva's Router triages this issue
#                                                  cross-repo via the API.
#   - issues:labeled=approved → implement-issue → Eva builds the PR here.
#
# Security — the trust gate is the real anti-injection defense (D-004, eva#132).
# Auto-execution sources are EXACTLY two (kept identical to eva-implement's
# consuming-side gate — trust is re-verified there, never trusted from here):
#   - human MEMBER/OWNER (author_association + user.type == 'User'): a
#     non-member's issue body never reaches Eva's token-holding agents.
#   - the exact ievo-eva App (issue author login `ievo-eva[bot]`): Eva's own
#     audit findings, routed into the Router's adversarial skeptic mode
#     (default reject; self-approve only on the safe-path tier, capped).
#     We pin the exact App login, NEVER a general `user.type` relaxation —
#     otherwise any installed bot becomes an autonomous-build source.
# The implement relay additionally forwards WHO applied `approved`
# (approved_by_login + approved_by_association, resolved via the collaborators
# API): for a bot-authored issue the label sender must be a human MEMBER/OWNER
# (one-click adoption) or the App itself (skeptic self-approve) — eva-implement
# re-verifies this precisely on its side.
# No untrusted title/body crosses into a run: shell — only the issue number +
# author handle; Eva reads the body via the API in her agent sandbox.
name: Forward to Eva

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

jobs:
  new-issue:
    name: Dispatch new-issue to Eva
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event.action == 'opened' &&
      (
        ((github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'OWNER') &&
         github.event.issue.user.type == 'User')
        ||
        github.event.issue.user.login == 'ievo-eva[bot]'
      )
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ievo-ai
          repositories: eva
      - name: Dispatch new-issue
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ievo-ai/eva
          event-type: new-issue
          client-payload: >
            {
              "repo": "${{ github.repository }}",
              "issue_number": ${{ github.event.issue.number }},
              "event": "issues",
              "action": "opened",
              "author_association": "${{ github.event.issue.author_association }}",
              "issue_author_login": "${{ github.event.issue.user.login }}",
              "triggered_by": "${{ github.event.issue.user.login }}"
            }

  implement-issue:
    name: Dispatch implement-issue to Eva
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Removing + re-adding `approved` can fire this twice; collapse rapid
    # re-dispatches per issue (Eva's claim already no-ops duplicates, but make it
    # explicit at the forwarder too).
    concurrency:
      group: forward-implement-${{ github.event.issue.number }}
      cancel-in-progress: false
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'approved' &&
      (
        ((github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'OWNER') &&
         github.event.issue.user.type == 'User')
        ||
        (github.event.issue.user.login == 'ievo-eva[bot]' &&
         (github.event.sender.type == 'User' ||
          github.event.sender.login == 'ievo-eva[bot]'))
      )
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ievo-ai
          repositories: eva,skills
      - name: Resolve approved-by trust
        id: approver
        # The issues:labeled webhook carries no sender association, so resolve
        # the labeler's repo permission via the API and map it to the
        # association value eva-implement's dispatch gate expects. Fail-safe:
        # any error or <write permission → NONE (eva-implement refuses).
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          assoc="NONE"
          if [ "$SENDER" = "ievo-eva[bot]" ]; then
            # The App's own skeptic-mode self-approve; eva-implement admits it
            # via approved_by_login, association stays NONE.
            assoc="NONE"
          elif [ "$SENDER_TYPE" = "User" ]; then
            perm=$(gh api "repos/$REPO/collaborators/$SENDER/permission" \
              --jq '.permission' 2>/dev/null || echo "none")
            case "$perm" in
              admin) assoc="OWNER" ;;
              write) assoc="MEMBER" ;;
            esac
          fi
          echo "association=$assoc" >> "$GITHUB_OUTPUT"
      - name: Dispatch implement-issue
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ievo-ai/eva
          event-type: implement-issue
          client-payload: >
            {
              "repo": "${{ github.repository }}",
              "issue_number": ${{ github.event.issue.number }},
              "event": "issues",
              "action": "labeled",
              "author_association": "${{ github.event.issue.author_association }}",
              "issue_author_login": "${{ github.event.issue.user.login }}",
              "approved_by_login": "${{ github.event.sender.login }}",
              "approved_by_association": "${{ steps.approver.outputs.association }}",
              "triggered_by": "${{ github.event.issue.user.login }}"
            }
