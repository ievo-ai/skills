# Issue Handler — deep research → close or implement → review loop
#
# When a new issue opens in ievo-ai/skills, Claude (Opus, max effort)
# performs deep research on the codebase, then either:
#   (a) closes the issue with an explanation, or
#   (b) creates a real PR with implementation + tests, then iterates
#       on claude-code-review feedback until the review is green.
#
# Auth: generates a GitHub App token from org secrets APP_ID +
# APP_PRIVATE_KEY (not default GITHUB_TOKEN) so that PRs created by
# this workflow trigger downstream workflows (claude-code-review.yml,
# coverage-gate.yml, pre-commit-gate.yml).
#
# Security:
#   - GHA shell injection: closed. Untrusted issue title/body NEVER reach
#     run: blocks via template interpolation. Claude receives them via
#     `gh issue view` inside the agent subprocess.
#   - Indirect prompt injection (tool-output channel): partially mitigated.
#     The raw issue body still reaches Claude as tool output and could in
#     principle redirect agent behaviour ("ignore previous instructions, …").
#     Scope-lock prompt rules (never modify outside plugins/ievo/, never
#     touch workflow files) are prompt-only — not technically enforced
#     because Bash is in --allowedTools (needed for git ops + tests; no
#     structured-tool equivalent yet). Real defences against injection:
#       (1) Privilege ceiling: only `contents: write` + `issues: write` +
#           `pull-requests: write` + `actions: read`, plus `id-token: write`
#           which claude-code-action requires for its internal OIDC startup
#           (v0.6.16 stripped it on a wrong assumption, v0.6.17 restored it —
#           see the per-permission comment in the `permissions:` block).
#           NO `secrets: read` — agent has no path to read other secrets;
#           the id-token tokens it mints are workflow-run-scoped, not
#           credentials for external services.
#       (2) No auto-merge — human gate on every PR.
#       (3) Bot-loop block (`endsWith('[bot]')`) prevents the App from
#           triggering itself if a Phase 3A bug ever opens an issue.
#       (4) Per-issue concurrency scope prevents the same issue spawning
#           parallel handlers.
#     When `claude-code-action` ships per-pattern Bash disallowlists or a
#     `--network-isolated` flag, tighten further.
#
# Safety:
#   - Never auto-merges — PR sits for human review + merge
#   - Bot loop prevention — ignores issues from bots
#   - Max 3 fix attempts on review feedback before giving up
#   - Scope: only touches plugins/ievo/, never workflows or root config
#
# Tracked as ievo-ai/skills#65.

name: "Issue Handler"

on:
  issues:
    types: [opened]

permissions:
  contents: write       # push branches + create commits during fix loop
  issues: write         # post acknowledgment / completion / exhaustion comments
  pull-requests: write  # create PRs, comment on them, read review state
  actions: read         # Phase 5 polls `gh pr checks` which needs read on Actions runs
  id-token: write       # REQUIRED by anthropics/claude-code-action@v1's internal
                        # OIDC token exchange — without this, the action fails
                        # at startup with `Unable to get ACTIONS_ID_TOKEN_REQUEST_URL`.
                        # Earlier rounds of this PR omitted it on the assumption
                        # that `actions/create-github-app-token@v1` (the only
                        # explicit OIDC consumer in the workflow) doesn't need
                        # it — that's true for create-github-app-token but NOT
                        # for claude-code-action itself, which uses its own
                        # OIDC flow internally. Verified live on issue #72:
                        # run 26360211550 failed with the exact error above
                        # before id-token was restored. The privilege is bounded
                        # to this workflow's `permissions:` block (not org-wide),
                        # so the OIDC tokens it mints are only valid for this
                        # workflow run's audience — narrow attack surface.

concurrency:
  group: issue-handler-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handle-issue:
    name: "Deep Research → Implement"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Bot loop prevention: skip issues from ANY bot account (catches the
    # workflow's own App bot if it ever opens an issue via its installation
    # token — exact-match against github-actions[bot] would miss that) plus
    # the upstream Eva account. NOTE: label filters (wontfix / duplicate)
    # are NOT included here — the `opened` webhook fires before labels are
    # applied by the web UI, so any label check on this event evaluates as
    # "no labels yet" for human-opened issues and gives false safety. The
    # real guards are the bot-login filter + the `cancel-in-progress: false`
    # concurrency scope + the no-auto-merge invariant. If a maintainer
    # genuinely needs to abort a run on a labelled issue, they can close
    # the issue or close the resulting PR — both stop the loop.
    if: >
      !endsWith(github.event.issue.user.login, '[bot]') &&
      github.event.issue.user.login != 'ievo-eva'

    steps:
      # All actions pinned to commit SHA (not floating tags) — public repo
      # with `contents: write` + App private key handling = supply-chain
      # attack surface if any major-version tag is force-moved. Comment
      # next to each pin = the version it represents at pin time; bump
      # SHA + comment together when updating.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      - name: Run Issue Handler
        uses: anthropics/claude-code-action@537ffff2eff706bd7e3e1c3daf2d4b39067a9f85  # v1.0.133
        env:
          # Pass App token + issue context via step-level env, NOT via template
          # interpolation into the `settings:` JSON below. `create-github-app-token@v1`
          # currently outputs `ghs_XXX` (alphanumeric + underscore, JSON-safe) but
          # any future token format change introducing `"` or `\` would silently
          # produce malformed JSON and an opaque action parse error rather than a
          # clear auth failure. Step-level env is the action's documented channel
          # and removes the invariant dependency on token character set.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # show_full_output: false (default — was `true`, dropped per round-4
          # review S2). The App token from `create-github-app-token@v1` is
          # auto-masked in Actions logs by GitHub's secret-scanner, but Claude
          # debug commands (`env`, `printenv`, verbose git output) could surface
          # other context unnecessarily. The job-level Actions log is the right
          # place to dig if a run needs diagnosis; flip back to true temporarily
          # if needed.
          # max_turns intentionally NOT set — full cycle (Phase 1 context load +
          # Phase 2 deep research + Phase 4 implement + tests + validators +
          # Phase 5 review loop ×3) can easily exceed any hand-picked cap on a
          # non-trivial feature, producing an incomplete PR with no completion
          # signal. The job's `timeout-minutes: 60` is the real wall clock.
          # ACCEPTED RISK — Bash is in --allowedTools because git operations
          # (checkout / commit / push / running the test suite) happen inside
          # the agent's session and have no structured-tool equivalent. The
          # scope-lock rules in the agent prompt below ("NEVER modify files
          # outside plugins/ievo/", "NEVER touch workflow files") are prompt-
          # only and not technically enforced — a crafted issue body could in
          # principle prompt-inject around them. Risk mitigations layered in:
          # (1) privilege ceiling — `contents/issues/pull-requests: write` +
          # `actions: read` for poll; `id-token: write` is present because
          # claude-code-action's startup OIDC needs it (v0.6.17 restored
          # after v0.6.16 broke startup by stripping it). NO `secrets: read`,
          # so the agent can't read other org secrets through this workflow;
          # (2) bot-loop prevention `endsWith('[bot]')` blocks the workflow's
          # own App from triggering itself; (3) `cancel-in-progress: false`
          # scoped per-issue prevents the same issue spawning parallel runs;
          # (4) human review required before merge — no auto-merge ever.
          # If/when claude-code-action ships per-pattern Bash disallowlists or
          # a --network-isolated flag, tighten this further.
          claude_args: |
            --model opus
            --allowedTools "Bash,Edit,Read,Write,Glob,Grep,WebFetch,WebSearch"
          prompt: |
            You are an autonomous issue handler for the ievo-ai/skills repo.
            Your job: deep research on issue #${{ github.event.issue.number }},
            then either close it with an explanation or implement a fix/feature
            with a real PR that passes all CI checks.

            IMPORTANT: Use Opus-level depth and thoroughness. Max effort.

            ## Phase 1 — Load Context

            Read in order (stop when you have enough):
            1. AGENTS.md — project conventions, test rules, version bumping, branch naming
            2. The issue:
                 gh issue view "$ISSUE_NUMBER" --repo "$REPO" \
                   --json title,body,author,labels,createdAt
            3. Relevant source files in plugins/ievo/ based on the issue topic
            4. Existing tests in plugins/ievo/scripts/tests/
            5. Recent PRs for context:
                 gh pr list --repo "$REPO" --state merged --limit 10 \
                   --json number,title,headRefName

            ## Phase 2 — Deep Research

            Thoroughly investigate the issue:
            - Read ALL relevant source files, not just the ones mentioned
            - Trace code paths end-to-end
            - Check git history for related changes:
                 git log --oneline -20
            - Search for related patterns:
                 grep -r "<relevant terms>" plugins/ievo/
            - Understand the full impact of any proposed change

            ## Phase 3 — Triage Decision

            Decide ONE of:

            ### Option A: Close (not actionable)
            If the issue is: duplicate, out of scope, already fixed, invalid,
            or fundamentally misguided — close with a detailed comment explaining
            WHY. Write the comment to /tmp/close-comment.md, then:

              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
                --body-file /tmp/close-comment.md
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" \
                --reason "not planned"

            Then STOP. Do not proceed to Phase 4.

            ### Option B: Implement
            If the issue is actionable — proceed to Phase 4.

            Post a comment acknowledging you're working on it:
              echo "Working on implementation. Will create a PR shortly." | \
                gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file -

            ## Phase 4 — Implementation

            ### 4a. Determine version bump

            Read current version from plugins/ievo/.claude-plugin/plugin.json.
            Decide bump level:
            - patch (x.y.Z) for bug fixes
            - minor (x.Y.0) for new features/skills
            - major (X.0.0) for breaking changes (rare)

            ### 4b. Create feature branch

            Branch naming per AGENTS.md:
              git checkout -b feat/v<new_version>-<short-desc>
            or:
              git checkout -b fix/v<new_version>-<short-desc>

            ### 4c. Implement the change

            Follow ALL conventions from AGENTS.md:
            - Scripts: Node.js .mjs, stdlib only, ESM
            - Agent model frontmatter: family aliases only (sonnet/opus/haiku/inherit)
            - Skills: agentskills.io spec compliant
            - No Python, no external dependencies

            ### 4d. Write/update tests

            100% test coverage is MANDATORY (AGENTS.md rule, enforced by CI).
            - Tests in plugins/ievo/scripts/tests/*.test.mjs
            - Use built-in node:test (no jest/vitest)
            - Every exported function, every branch, every error path
            - Run tests locally to verify:
                node --test --experimental-test-coverage \
                  --test-reporter=lcov --test-reporter-destination=coverage.lcov \
                  --test-reporter=spec --test-reporter-destination=stdout \
                  plugins/ievo/scripts/tests/*.test.mjs
                node .github/scripts/check-coverage.mjs coverage.lcov

            ### 4e. Run pre-commit validators locally

              node .github/scripts/validators/nested-fences.mjs <changed files>
              node .github/scripts/validators/crlf-frontmatter.mjs <changed files>
              node .github/scripts/validators/machine-local-paths.mjs <changed files>
              node .github/scripts/validators/placeholder-leakage.mjs <changed files>
              node .github/scripts/validators/utf8-validate.mjs <changed files>
              # If agent .md files changed:
              node plugins/ievo/scripts/validate_agents.mjs

            ### 4f. Version bump (atomic against latest main, NOT branch-time main)

            Pick the version by querying main's CURRENT state at this moment,
            NOT the version that was on main when this job started. Another
            issue-handler run or human PR may have landed since. Race-safe:

              CURRENT_MAIN_VER=$(gh api "repos/$REPO/contents/plugins/ievo/.claude-plugin/plugin.json?ref=main" \
                --jq '.content' | base64 -d | jq -r '.version')
              # Next patch slot (semver patch bump for fixes, minor for new
              # features/skills; never pick a number that's currently in flight
              # on an open PR — check open PRs and skip any version they claim):
              IN_FLIGHT_VERS=$(gh pr list --repo "$REPO" --state open \
                --json title,body --jq '.[] | (.title + " " + (.body // "")) | scan("v0\\.[0-9]+\\.[0-9]+") | .[1:]' \
                | sort -u)
              # Pick the smallest version > CURRENT_MAIN_VER that's not in IN_FLIGHT_VERS.
              # Implement in shell with awk/jq or Node one-liner. If you can't compute
              # reliably, pick CURRENT_MAIN_VER + 0.0.2 (skip one to avoid race) and
              # leave a note in the PR body that the version was conservatively bumped.

            Bump THE FOUR FILES per AGENTS.md § Version bumping — coupling
            assertion in discover.test.mjs enforces it on coverage-gate;
            missing the discover.mjs SCRIPT_VERSION bump burns a fix-round
            for a trivial miss:
            1. .claude-plugin/marketplace.json → "metadata.version"
            2. .claude-plugin/marketplace.json → "plugins[0].version"
            3. plugins/ievo/.claude-plugin/plugin.json → "version"
            4. plugins/ievo/scripts/discover.mjs → export const SCRIPT_VERSION
            Also bump the "Current compliance ledger (vX.Y.Z)" header in
            AGENTS.md to match.

            ### 4f.5. CHANGELOG.md entry (required, mirrors AGENTS.md convention)

            Per AGENTS.md § Changelog — every shipped version MUST have an
            entry in CHANGELOG.md at the repo root. Reverse-chronological;
            insert ABOVE the previous-current entry:

              # Read the current top of CHANGELOG.md to find the insertion point:
              head -20 CHANGELOG.md

              # Then prepend a new "## v<new_version>" section before the previous
              # top entry. One paragraph (or short bullet list) describing what
              # changed and why; reference Closes #$ISSUE_NUMBER. Use generic
              # language per AGENTS.md § Public-repo content safety — no secret
              # names, no internal endpoints, no infra attack-vector hints.

            ### 4g. Commit

            Use descriptive commit messages. Footer MUST include:
              Co-Authored-By: iEVO <noreply@ievo.ai>

            Stage only the files you changed (no git add -A):
              git add <specific files>
              git commit -m "<type>: <description>

              Closes #$ISSUE_NUMBER

              Co-Authored-By: iEVO <noreply@ievo.ai>"

            ### 4h. Pre-push freshness check + rebase loop, THEN create PR

            Before pushing, verify our branch is still ahead of main.
            Main may have moved while Phase 1-4 ran (another issue-handler
            run, a human merge, a hotfix). Pushing a stale branch creates
            a CONFLICTING PR — and CONFLICTING PRs get NO CI checks fired
            (GitHub Actions skips `pull_request` events on PRs that can't
            merge cleanly), so the Phase 5 review loop dies silently.
            Rebase loop with up to 3 attempts (covers near-simultaneous
            sibling pushes):

              REBASE_ATTEMPT=0
              REBASE_MAX=3
              while [ "$REBASE_ATTEMPT" -lt "$REBASE_MAX" ]; do
                git fetch origin main
                BEHIND=$(git rev-list --count HEAD..origin/main)
                if [ "$BEHIND" = "0" ]; then
                  break   # branch is fresh, nothing to rebase
                fi
                echo "Main moved by $BEHIND commits — rebasing (attempt $((REBASE_ATTEMPT+1))/$REBASE_MAX)"

                # `--onto origin/main <merge-base>` replays only our unique
                # commits on the latest main tip. Conflict-likely files: the
                # 4 version files + AGENTS.md ledger header + CHANGELOG.md
                # (all touched in Phase 4f / 4f.5).
                MERGE_BASE=$(git merge-base HEAD origin/main)
                if git rebase --onto origin/main "$MERGE_BASE" HEAD; then
                  echo "Rebase succeeded clean"
                else
                  # Conflicts. The only EXPECTED conflict surface is version
                  # files (race against a sibling PR that bumped the same
                  # version). Auto-resolve by re-running Phase 4f's
                  # version-pick query against the post-rebase main state:
                  echo "Conflicts detected — auto-resolving version files"

                  # Step 1: FIRST, abort early on ANY non-version conflict —
                  # the handler is not allowed to autonomously resolve arbitrary
                  # code conflicts. This check runs BEFORE any write so that an
                  # operator-needed escalation doesn't leave partial state.
                  if git diff --name-only --diff-filter=U | grep -v -E '^(\.claude-plugin/marketplace\.json|plugins/ievo/\.claude-plugin/plugin\.json|plugins/ievo/scripts/discover\.mjs|AGENTS\.md|CHANGELOG\.md)$' | grep -q .; then
                    git rebase --abort
                    echo "Unexpected non-version conflict — escalating to issue thread"
                    gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file - <<ESC
              Rebase against latest main produced conflicts in non-version files. The handler
              auto-resolves version-bump conflicts only — other conflicts need operator review.
              ESC
                    exit 1
                  fi

                  # Step 2: Re-query latest main version (it just moved during
                  # our run) and compute the next free slot.
                  NEW_MAIN_VER=$(gh api "repos/$REPO/contents/plugins/ievo/.claude-plugin/plugin.json?ref=main" \
                    --jq '.content' | base64 -d | jq -r '.version')

                  # Step 3: WRITE the 4 version files + AGENTS.md ledger header
                  # + CHANGELOG.md (re-do the Phase 4f / 4f.5 outputs against the
                  # newly-picked version). This re-writes conflict markers with
                  # clean post-rebase content.

                  # Step 4: AFTER writing, stage all the resolved files:
                  git add .claude-plugin/marketplace.json \
                          plugins/ievo/.claude-plugin/plugin.json \
                          plugins/ievo/scripts/discover.mjs \
                          AGENTS.md CHANGELOG.md

                  # Step 5: continue the rebase with the resolved files.
                  # (No sanity-recheck for non-version conflicts here — they
                  # were caught in Step 1 before any write happened, so
                  # nothing in Steps 2-4 could have introduced one.)
                  GIT_EDITOR=true git rebase --continue
                fi
                REBASE_ATTEMPT=$((REBASE_ATTEMPT+1))
              done

              # Re-run tests + pre-commit AFTER the final rebase — main may
              # have changed something that interacts with our edit:
              node --test plugins/ievo/scripts/tests/*.test.mjs
              pre-commit run --all-files || pre-commit run --all-files  # 2nd run picks up auto-fixes

              # Push (force-with-lease since rebase rewrote local history;
              # safe on a topic branch nobody else pushes to):
              git push --force-with-lease origin HEAD -u

            Create PR (real, not draft). Use --body-file for safety.

            Unquoted heredoc — $ISSUE_NUMBER expands to the actual number
            (mirrors the Phase 6 DONEEOF pattern). Single-quoted 'PREOF'
            would block expansion and require model-dependent substitution
            of `<issue number>`, fragile when LLM context is full:

              cat > /tmp/pr-body.md << PREOF
              ## Summary
              <1-3 bullet points explaining the change>

              ## Issue
              Closes #$ISSUE_NUMBER

              ## Test plan
              - [ ] All tests pass with 100% coverage
              - [ ] Pre-commit validators pass
              - [ ] Version bumped in all 4 files per AGENTS.md (marketplace.json ×2 + plugin.json + discover.mjs SCRIPT_VERSION)

              ---
              Automated by Issue Handler workflow.
              PREOF

              # `gh pr create` writes the PR URL to stdout, NOT the bare number.
              # Capture and extract the number — every gh subcommand in Phase 5
              # below (`gh pr checks <N>`, `gh pr view <N>`, `gh pr comment <N>`)
              # needs the number, not the URL.
              PR_URL=$(gh pr create --repo "$REPO" \
                --title "<type>: <short description>" \
                --body-file /tmp/pr-body.md \
                --head "$(git branch --show-current)")
              PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
              echo "Created PR #$PR_NUMBER ($PR_URL)"

            ## Phase 5 — Review Loop

            After creating the PR, wait for claude-code-review to run and
            iterate on its feedback. Max 3 fix iterations.

            ATTEMPT=0                       # real-finding fix attempts
            MAX_ATTEMPTS=3
            STRUCTURAL_ATTEMPT=0             # action-side flake retriggers (separate budget)
            STRUCTURAL_MAX=3

            Loop:
              1. The PR number is in $PR_NUMBER (extracted at the end of Phase 4
                 from the `gh pr create` URL). Use it for all gh subcommands.
              2. Wait for checks to complete. `gh pr checks --json state` returns
                 **lowercase** state strings: "pending" (queued OR running),
                 "pass", "fail", "skipping", "cancelled", "timeout", "neutral".
                 Normalize to uppercase via `| ascii_upcase` so the shell
                 comparison is unambiguous (mixed-case bugs silently break the
                 loop). PENDING = keep waiting; everything else = terminal.
                 Poll every 60s with an ENFORCED 10-minute outer timeout
                 (don't trust the job's 60-minute wall clock — that's a backstop,
                 not a per-poll bound):
                   # MAX_WAIT=600 (10 min) — claude-code-review typically
                   # completes in 2-5 min. 3 attempts × 10 min poll = 30 min
                   # leaves ~30 min in the 60-min job wall clock for Phase 1-4
                   # implementation work; 3 × 15 min would have blown the
                   # budget on the third iteration with no diagnostic.
                   MAX_WAIT=600
                   waited=0
                   while [ "$waited" -lt "$MAX_WAIT" ]; do
                     # `last` not `.[0]` — if `gh pr checks` ever returns
                     # multiple claude.*review entries (e.g. a rerun creates
                     # a second), the most-recently-appended one is the
                     # authoritative state, not the first in the response.
                     STATUS=$(gh pr checks "$PR_NUMBER" --repo "$REPO" \
                       --json name,state --jq \
                       '[.[] | select(.name | test("claude.*review"; "i"))] | last.state // "pending" | ascii_upcase')
                     [ "$STATUS" = "PENDING" ] || break
                     sleep 60
                     waited=$((waited + 60))
                   done
                 Then branch on $STATUS for next-step routing —
                   PASS    → step 3 (success path)
                   FAIL    → step 2.5 (distinguish structural vs real BEFORE fixing)
                   PENDING → step 2.6 (check mergeable: if DIRTY, rebase + retry;
                                       otherwise timed out — diagnostic + exit)
                   any other (SKIPPING/CANCELLED/TIMEOUT/NEUTRAL) → step 2.5
                                       (treat as structural; may auto-recover)

              2.5. Distinguish STRUCTURAL claude-review failures from REAL
                   code findings BEFORE consuming a fix-attempt. Several known
                   failure modes are action-side bugs / GitHub Actions flakes,
                   NOT findings on our code, and the correct recovery is
                   retrigger (close+reopen the PR), NOT iterate on phantom
                   findings:

                     # Fetch the latest claude-review run's log
                     RUN_ID=$(gh run list --repo "$REPO" --branch \
                       "$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq .headRefName)" \
                       --workflow "Claude Code Review" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
                     if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
                       # No run found yet — race against workflow dispatch.
                       # Sleep + restart poll loop without consuming a fix-attempt
                       # (treat as transient; the next poll iteration should see it).
                       echo "No claude-review run found yet — waiting for dispatch"
                       sleep 30
                       continue  # restart Phase 5 poll loop from step 2 (pseudo-code marker — Claude reads this as "restart the while-loop body shown in step 2 above")
                     fi
                     LOG=$(gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>&1)

                     # Known structural patterns (don't count as a real fix attempt):
                     if echo "$LOG" | grep -qE "HttpError: Bad credentials|Workflow validation failed|Workflow initiated by non-human actor|Could not fetch an OIDC token|App token exchange failed"; then
                       STRUCTURAL_ATTEMPT=$((STRUCTURAL_ATTEMPT + 1))
                       # Cap structural retriggers separately from real-finding fixes
                       # — if OIDC / credentials / allowed-bots are permanently broken,
                       # we'd otherwise loop close+reopen until the job's 60-min
                       # wall-clock killed us silently. STRUCTURAL_MAX=3 should be
                       # initialized to 0 alongside ATTEMPT at the top of Phase 5.
                       if [ "$STRUCTURAL_ATTEMPT" -ge "${STRUCTURAL_MAX:-3}" ]; then
                         echo "Structural failures persist after $STRUCTURAL_ATTEMPT retriggers — escalating"
                         MSG="Structural CI failures persisted across $STRUCTURAL_ATTEMPT retriggers on PR #$PR_NUMBER. This is likely a permanent action-side problem (missing org secret, revoked token, claude-code-action regression). Manual operator review needed."
                         echo "$MSG" | gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file -
                         echo "$MSG" | gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file -
                         exit 1
                       fi
                       echo "Structural claude-review failure ($STRUCTURAL_ATTEMPT/$STRUCTURAL_MAX) — retrigger via close+reopen"
                       gh pr close "$PR_NUMBER" --repo "$REPO" --comment "Auto-close to retrigger after structural CI failure"
                       # sleep 15 — 5s was occasionally too short under load /
                       # during GitHub incidents; the close state needs to
                       # propagate before the API accepts reopen (otherwise 422
                       # "PR is already open"). Costs nothing on the happy path.
                       sleep 15
                       gh pr reopen "$PR_NUMBER" --repo "$REPO"
                       # Restart the poll loop WITHOUT incrementing ATTEMPT —
                       # nothing was wrong with our code, the workflow infra hiccupped
                       continue  # restart Phase 5 poll loop from step 2 (pseudo-code marker — Claude reads this as "restart the while-loop body shown in step 2 above")
                     fi

                     # Real review failure — proceed to step 4 (fix loop)

              2.6. PENDING-routing — if no checks fired after MAX_WAIT, the
                   PR may be DIRTY (CONFLICTING vs main; GitHub Actions skips
                   `pull_request` events on PRs that can't merge cleanly).
                   This is exactly the race PR #75 hit when main moved
                   underneath while the handler was running. Check + recover:

                     MERGE_STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
                       --json mergeStateStatus --jq .mergeStateStatus)
                     if [ "$MERGE_STATE" = "DIRTY" ]; then
                       echo "PR is conflicting against main — rebase via the Phase 4h loop"
                       # Re-execute the EXACT shell block shown in Phase 4h above
                       # (the `while [ "$REBASE_ATTEMPT" -lt "$REBASE_MAX" ]; do`
                       # loop with all five numbered steps inside the conflict
                       # branch). It already encapsulates fetch → rebase → auto-
                       # resolve version files → continue → push --force-with-lease,
                       # and escalates via `exit 1` on non-version conflicts.
                       # Restart REBASE_ATTEMPT=0 before re-running so the full
                       # 3-attempt budget is fresh for THIS recovery.
                       REBASE_ATTEMPT=0
                       # (re-run the Phase 4h while-loop body here — pseudo-code
                       # marker, NOT a literal goto; Claude reads this and
                       # re-executes the shell shown above)
                       continue  # restart Phase 5 poll loop from step 2 (pseudo-code marker — Claude reads this as "restart the while-loop body shown in step 2 above")
                     fi
                     # Otherwise genuinely timed out — diagnostic + exit.

              3. If all checks pass → done! Post success comment and exit.

              4. If claude-code-review has findings:
                   - Read the review comments. `claude-code-action` uses
                     `use_sticky_comment: true` which posts a single sticky
                     issue-comment, not inline review diff-comments. Read both
                     channels (sticky covers ~all cases; the `pulls/.../comments`
                     endpoint is for inline diff-anchored review comments,
                     populated only when an upstream reviewer chooses that mode):
                       # Sticky comment + any review summaries — covers claude-code-action
                       gh pr view "$PR_NUMBER" --repo "$REPO" --json reviews,comments
                       # Top-level PR thread comments (the `issues/<N>/comments`
                       # endpoint serves the PR thread for issue-numbered PRs —
                       # that's where claude-code-action's sticky comment lives,
                       # so filter for `claude*[bot]` author to read the review
                       # body. The literal `pulls/<N>/comments` endpoint is for
                       # inline diff-anchored review comments, which sticky-mode
                       # doesn't use; not read here.
                       gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                         --jq '.[] | select(.user.login | test("claude.*\\[bot\\]"; "i")) | .body'
                   - Address EACH finding:
                       * Read the specific file and line
                       * Understand the reviewer's concern
                       * Fix the issue
                       * Re-run tests + validators locally
                   - Commit the fixes:
                       git add <fixed files>
                       git commit -m "fix: address review feedback (attempt $ATTEMPT)

                       Co-Authored-By: iEVO <noreply@ievo.ai>"
                       git push
                   - Increment ATTEMPT
                   - If ATTEMPT >= MAX_ATTEMPTS, post the exhaustion summary
                     to BOTH the original issue thread AND the PR thread so
                     a reviewer landing on the PR sees the loop gave up
                     (otherwise the PR looks silently abandoned with no
                     indication that review attempts were exhausted):
                       MSG="Reached max fix attempts ($MAX_ATTEMPTS). Leaving PR #$PR_NUMBER open for human review.
                       Latest claude-review findings remain in the PR thread above; manual triage needed."
                       echo "$MSG" | gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file -
                       echo "$MSG" | gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file -
                       break
                   - Otherwise, go back to step 2

            ## Phase 6 — Completion

            When the PR is green (all checks pass):

              # Unquoted heredoc — $PR_NUMBER expands to the actual PR number
              # (captured in Phase 4 from `gh pr create` URL). Single-quoted
              # 'DONEEOF' would have blocked expansion → the comment would
              # literally read "PR #<number>" instead of "PR #123".
              cat > /tmp/done-comment.md << DONEEOF
              Implementation complete. PR #$PR_NUMBER is ready for human review and merge.

              **Checks status:**
              - Coverage Gate: 100% maintained
              - Pre-commit Gate: all validators pass
              - Claude Code Review: addressed

              This PR will NOT be auto-merged. A human must review and merge.
              DONEEOF

              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
                --body-file /tmp/done-comment.md

            ## Safety Rules (non-negotiable)

            - NEVER auto-merge the PR. Human must review and merge.
            - NEVER modify files outside plugins/ievo/ unless the issue
              explicitly requires it (e.g., adding a validator to .github/scripts/).
            - NEVER modify workflow files (.github/workflows/*.yml).
            - NEVER lower test coverage below 100%.
            - NEVER skip the version bump.
            - If you're unsure about something, post a comment on the issue
              asking for clarification instead of guessing.
            - Merge strategy: merge commit, never squash (AGENTS.md rule).
            - Do not create issues in other repos.
            - If the issue mentions a tool/library behavior, verify via docs
              before implementing.
