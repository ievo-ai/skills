# Issue Handler — deep research → close or implement → review loop
#
# When a new issue opens in ievo-ai/skills, Claude (Opus, max effort)
# performs deep research on the codebase, then either:
#   (a) closes the issue with an explanation, or
#   (b) creates a real PR with implementation + tests, then iterates
#       on claude-code-review feedback until the review is green.
#
# Auth: generates a GitHub App token from org secrets APP_ID +
# APP_PRIVATE_KEY (not default GITHUB_TOKEN) so that PRs created by
# this workflow trigger downstream workflows (claude-code-review.yml,
# coverage-gate.yml, pre-commit-gate.yml).
#
# Security:
#   - GHA shell injection: closed. Untrusted issue title/body NEVER reach
#     run: blocks via template interpolation. Claude receives them via
#     `gh issue view` inside the agent subprocess.
#   - Indirect prompt injection (tool-output channel): partially mitigated.
#     The raw issue body still reaches Claude as tool output and could in
#     principle redirect agent behaviour ("ignore previous instructions, …").
#     Scope-lock prompt rules (never modify outside plugins/ievo/, never
#     touch workflow files) are prompt-only — not technically enforced
#     because Bash is in --allowedTools (needed for git ops + tests; no
#     structured-tool equivalent yet). Real defences against injection:
#       (1) Privilege ceiling: only `contents: write` + `issues: write` +
#           `pull-requests: write` + `actions: read`, plus `id-token: write`
#           which claude-code-action requires for its internal OIDC startup
#           (v0.6.16 stripped it on a wrong assumption, v0.6.17 restored it —
#           see the per-permission comment in the `permissions:` block).
#           NO `secrets: read` — agent has no path to read other secrets;
#           the id-token tokens it mints are workflow-run-scoped, not
#           credentials for external services.
#       (2) No auto-merge — human gate on every PR.
#       (3) Bot-loop block (`endsWith('[bot]')`) prevents the App from
#           triggering itself if a Phase 3A bug ever opens an issue.
#       (4) Per-issue concurrency scope prevents the same issue spawning
#           parallel handlers.
#     When `claude-code-action` ships per-pattern Bash disallowlists or a
#     `--network-isolated` flag, tighten further.
#
# Safety:
#   - Never auto-merges — PR sits for human review + merge
#   - Bot loop prevention — ignores issues from bots
#   - Max 3 fix attempts on review feedback before giving up
#   - Scope: only touches plugins/ievo/, never workflows or root config
#
# Tracked as ievo-ai/skills#65.

name: "Issue Handler"

on:
  issues:
    types: [opened]

permissions:
  contents: write       # push branches + create commits during fix loop
  issues: write         # post acknowledgment / completion / exhaustion comments
  pull-requests: write  # create PRs, comment on them, read review state
  actions: read         # Phase 5 polls `gh pr checks` which needs read on Actions runs
  id-token: write       # REQUIRED by anthropics/claude-code-action@v1's internal
                        # OIDC token exchange — without this, the action fails
                        # at startup with `Unable to get ACTIONS_ID_TOKEN_REQUEST_URL`.
                        # Earlier rounds of this PR omitted it on the assumption
                        # that `actions/create-github-app-token@v1` (the only
                        # explicit OIDC consumer in the workflow) doesn't need
                        # it — that's true for create-github-app-token but NOT
                        # for claude-code-action itself, which uses its own
                        # OIDC flow internally. Verified live on issue #72:
                        # run 26360211550 failed with the exact error above
                        # before id-token was restored. The privilege is bounded
                        # to this workflow's `permissions:` block (not org-wide),
                        # so the OIDC tokens it mints are only valid for this
                        # workflow run's audience — narrow attack surface.

concurrency:
  group: issue-handler-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handle-issue:
    name: "Deep Research → Implement"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Bot loop prevention: skip issues from ANY bot account (catches the
    # workflow's own App bot if it ever opens an issue via its installation
    # token — exact-match against github-actions[bot] would miss that) plus
    # the upstream Eva account. NOTE: label filters (wontfix / duplicate)
    # are NOT included here — the `opened` webhook fires before labels are
    # applied by the web UI, so any label check on this event evaluates as
    # "no labels yet" for human-opened issues and gives false safety. The
    # real guards are the bot-login filter + the `cancel-in-progress: false`
    # concurrency scope + the no-auto-merge invariant. If a maintainer
    # genuinely needs to abort a run on a labelled issue, they can close
    # the issue or close the resulting PR — both stop the loop.
    if: >
      !endsWith(github.event.issue.user.login, '[bot]') &&
      github.event.issue.user.login != 'ievo-eva'

    steps:
      # All actions pinned to commit SHA (not floating tags) — public repo
      # with `contents: write` + App private key handling = supply-chain
      # attack surface if any major-version tag is force-moved. Comment
      # next to each pin = the version it represents at pin time; bump
      # SHA + comment together when updating.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      # Load the handler prompt from a separate file to keep the
      # workflow YAML under GitHub's workflow-file parser limits.
      # The prompt lives in .github/prompts/issue-handler.md and uses
      # $ISSUE_NUMBER / $REPO (set as step-level env below) instead
      # of ${{ }} expressions. Multiline env var via heredoc delimiter.
      # CONSTRAINT: issue-handler.md must never contain the literal
      # string "PROMPT_DELIMITER_EOF" on a line by itself — that is
      # the heredoc delimiter for the env var assignment below.
      - name: Load handler prompt
        run: |
          if grep -qxF 'PROMPT_DELIMITER_EOF' .github/prompts/issue-handler.md; then
            echo "::error::issue-handler.md contains the heredoc delimiter on its own line"
            exit 1
          fi
          {
            echo "HANDLER_PROMPT<<PROMPT_DELIMITER_EOF"
            cat .github/prompts/issue-handler.md
            echo ""
            echo "PROMPT_DELIMITER_EOF"
          } >> "$GITHUB_ENV"

      - name: Run Issue Handler
        uses: anthropics/claude-code-action@537ffff2eff706bd7e3e1c3daf2d4b39067a9f85  # v1.0.133
        env:
          # Step-level env, NOT template interpolation into JSON.
          # create-github-app-token currently outputs ghs_XXX (JSON-safe)
          # but any future token format change introducing " or \ would
          # silently produce malformed JSON if interpolated directly.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model opus
            --allowedTools "Bash,Edit,Read,Write,Glob,Grep,WebFetch,WebSearch"
          prompt: ${{ env.HANDLER_PROMPT }}
