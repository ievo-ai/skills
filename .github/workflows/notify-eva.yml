# Request Eva review when a PR's product CI passes — she reviews and (for
# Eva-authored PRs) auto-merges. D-004 / eva#106 Phase 2, PR-review half.
#
# skills has TWO product gates (Coverage Gate + Pre-commit Gate) and NO branch
# protection, and eva-review-pr trusts the forwarder to only dispatch on green
# (it doesn't re-check CI). So this forwarder fires when either gate completes,
# then verifies BOTH gates are green for the head SHA before dispatching — that
# all-green check is the merge-safety gate for an unprotected repo.
#
# Public repo → mints a short-lived App token (no long-lived PAT at rest). The
# dispatch actor becomes the App bot; eva-review-pr's loop filter carves out
# eva-impl/* branches so App-authored PRs still get reviewed.
name: Request Eva Review

on:
  workflow_run:
    workflows: ["Coverage Gate", "Pre-commit Gate"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    name: Dispatch review-pr to Eva
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Both gates finish close together and each re-fires this workflow; serialize
    # runs for the same head SHA. This prevents OVERLAPPING execution, not a
    # second dispatch — if both gate-completion runs observe all-green they both
    # dispatch. That's tolerable: eva-review-pr is keyed per-PR with
    # cancel-in-progress:true (last dispatch wins) and the merge is idempotent
    # (the PR is already merged/closed by the first), so the worst case is one
    # redundant review comment, never a double merge.
    concurrency:
      group: notify-eva-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.owner.login == 'ievo-ai'
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ievo-ai
          repositories: eva,skills

      - name: Resolve PR + verify both gates green
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Find the non-draft open PR for this head SHA. The commits/{sha}/pulls
          # endpoint resolves it directly (robust vs. paginating all open PRs).
          PR=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq 'first(.[] | select(.state == "open" and (.draft | not))) // empty')
          if [ -z "$PR" ]; then
            echo "No non-draft open PR for $HEAD_SHA — skip"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PR_NUM=$(printf '%s' "$PR" | jq -r '.number')

          # Merge-safety gate: BOTH product gates must be green for this SHA
          # (this forwarder fires on either gate; the other's completion re-fires
          # it). check-run `.name` is the JOB id (no `name:` on those jobs), not
          # the workflow name — so match "coverage-gate"/"pre-commit-gate". Take
          # the latest run per gate.
          # per_page=100 (not --paginate): a single page holds all of a PR's
          # check-runs, and `--paginate` would apply the --jq filter per-page,
          # which could malform the result if checks ever spanned pages.
          #
          # Bounded retry (#425): the check-runs API can lag a few seconds
          # behind a gate's actual completion, so a firing landing right after
          # ITS OWN triggering gate finishes can read the OTHER gate as still
          # empty/pending even though it already finished. Both firings can
          # hit this at once, in which case neither ever dispatches (observed
          # live on PR #410). Retry up to 3 total attempts, 15s apart, before
          # falling through to the unchanged skip path below — 30s worst-case
          # added latency, well under a minute and inside the 5min job timeout.
          for attempt in 1 2 3; do
            CONCS=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "coverage-gate" or .name == "pre-commit-gate")]
                    | group_by(.name) | map(max_by(.started_at) | .conclusion) | sort | join(",")')
            [ "$CONCS" = "success,success" ] && break
            if [ "$attempt" -lt 3 ]; then
              echo "Not all product gates green yet (got: [$CONCS]), attempt $attempt/3 — retrying in 15s (check-runs visibility race)"
              sleep 15
            fi
          done
          if [ "$CONCS" != "success,success" ]; then
            echo "Not all product gates green yet (got: [$CONCS]) — skip; the other gate's completion will re-check"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "Both gates green for PR #$PR_NUM — dispatch"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Dispatch review-pr
        if: steps.gate.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ievo-ai/eva
          event-type: review-pr
          client-payload: >
            {
              "repo": "${{ github.repository }}",
              "pr_number": ${{ steps.gate.outputs.pr_number }},
              "head_sha": "${{ github.event.workflow_run.head_sha }}",
              "triggered_by": "${{ github.event.workflow_run.triggering_actor.login }}"
            }
