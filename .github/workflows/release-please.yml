# Release Please — automated version bumping via conventional commits
#
# On every push to main, release-please analyzes commit messages:
#   feat: → minor bump (0.6.x → 0.7.0)
#   fix:  → patch bump (0.6.24 → 0.6.25)
#   feat!: or BREAKING CHANGE: → major bump
#
# It creates/updates a persistent Release PR that accumulates changes.
# Merging the Release PR triggers the actual release (tag + bump in
# all 4 version files + AGENTS.md ledger + CHANGELOG.md).
#
# PRs no longer need to include version bumps — release-please handles
# all versioning atomically at release time via release-please-config.json.

name: "Release Please"

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
