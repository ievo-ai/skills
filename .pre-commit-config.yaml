# pre-commit hooks for ievo-ai/skills.
#
# Local enforcement layer mirroring .github/workflows/pre-commit-gate.yml —
# both call the SAME validator scripts in .github/scripts/validators/. The
# workflow is the hard gate (can't be bypassed); pre-commit is the fast
# feedback loop on the author's machine.
#
# Install (one-time per clone, uv-based — matches the iEvo toolchain):
#   uv tool install pre-commit  # or: pipx / pip install pre-commit, brew install pre-commit
#   pre-commit install          # wires .git/hooks/pre-commit
#
# Run manually against all files:
#   pre-commit run --all-files
#
# Bypass (use sparingly; the GHA workflow will still gate):
#   git commit --no-verify
#
# See AGENTS.md § "PR workflow conventions" for the why.

repos:
  - repo: local
    hooks:
      - id: validate-agents
        name: Agent frontmatter (vendor-neutral models, required fields)
        entry: node plugins/ievo/scripts/validate_agents.mjs plugins/ievo/agents
        language: system
        files: ^plugins/ievo/agents/.*\.md$
        pass_filenames: false

      - id: nested-fences
        name: Markdown nested-fence detection (closes-outer bug)
        entry: node .github/scripts/validators/nested-fences.mjs
        language: system
        files: \.md$

      - id: crlf-frontmatter
        name: CRLF in YAML frontmatter (validator-bypass surface)
        entry: node .github/scripts/validators/crlf-frontmatter.mjs
        language: system
        files: \.md$

      - id: machine-local-paths
        name: Machine-local path leakage (/Users/<name>/, /home/<name>/, C:\Users\)
        entry: node .github/scripts/validators/machine-local-paths.mjs
        language: system
        # Text-ish files: docs, configs, sources. Excludes binaries/lockfiles
        # which would be noisy and rarely contain user paths.
        files: \.(md|mjs|js|ts|py|sh|yaml|yml|json|txt)$
        exclude: ^(package-lock\.json|coverage\.lcov)$

      - id: placeholder-leakage
        name: Orphan TODO/FIXME/XXX/HACK without ticket reference
        entry: node .github/scripts/validators/placeholder-leakage.mjs
        language: system
        files: \.(md|mjs|js|ts|py|sh)$

      - id: validate-skills
        name: SKILL.md frontmatter (agentskills.io spec constraints)
        entry: node plugins/ievo/scripts/validate_skills.mjs
        language: system
        files: ^plugins/ievo/skills/.*SKILL\.md$
        pass_filenames: true

      - id: yaml-frontmatter
        name: YAML frontmatter syntax validation (catches unquoted colons, broken mappings)
        entry: node .github/scripts/validators/yaml-frontmatter.mjs
        language: system
        files: ^plugins/ievo/.*\.md$

      - id: utf8-validate
        name: UTF-8 byte integrity (Codex skill-load compatibility, rust-v0.133.0+)
        entry: node .github/scripts/validators/utf8-validate.mjs
        language: system
        # Text files iEvo ships: docs, skills, agents, scripts. Excludes binaries
        # / lockfiles. .md + .mjs cover the Codex skill-load surface explicitly;
        # the rest is defence-in-depth.
        files: \.(md|mjs|js|ts|py|sh|yaml|yml|json|txt)$
        exclude: ^(package-lock\.json|coverage\.lcov)$

  # Upstream builtin guard (not one of the local validators above): fails on
  # leftover merge-conflict markers (<<<<<<<, =======, >>>>>>>) reaching a
  # commit. --assume-in-merge makes it fire even outside a detected merge state
  # — `git rebase` does NOT set MERGE_HEAD, so botched REBASE resolutions are
  # caught too, not only `git merge` conflicts. Runs in both the local hook and
  # the pre-commit-gate.yml CI (can't be bypassed with --no-verify).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
